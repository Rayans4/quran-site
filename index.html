OCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>القرآن الكريم</title>
<link href="https://fonts.googleapis.com/css2?family=Scheherazade+New:wght@400;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--gold:#c9a84c;--gold-light:#e8c97a;--bg:#0a0c0f;--card:#111318;--card2:#181c23;--text:#f0ead6;--muted:#9a9080;--border:rgba(201,168,76,0.18);}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--text);font-family:'Cairo',sans-serif;min-height:100vh;}
header{text-align:center;padding:2.5rem 1rem 1.5rem;border-bottom:1px solid var(--border);}
.bismillah{font-family:'Scheherazade New',serif;font-size:clamp(1.6rem,4vw,2.6rem);color:var(--gold);margin-bottom:0.4rem;}
header h1{font-family:'Scheherazade New',serif;font-size:clamp(0.95rem,2.5vw,1.4rem);color:var(--muted);font-weight:400;}
.line{display:block;margin:0.8rem auto 0;width:180px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);}
.bar{position:sticky;top:0;z-index:50;background:rgba(10,12,15,0.97);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:0.8rem 1.2rem;display:flex;gap:0.8rem;align-items:center;flex-wrap:wrap;}
.bar input{flex:1;min-width:180px;background:var(--card2);border:1px solid var(--border);border-radius:50px;padding:0.5rem 1rem;color:var(--text);font-family:'Cairo',sans-serif;font-size:0.88rem;outline:none;direction:rtl;}
.bar input:focus{border-color:var(--gold);}
.bar select{background:var(--card2);border:1px solid var(--border);border-radius:50px;padding:0.5rem 1rem;color:var(--text);font-family:'Cairo',sans-serif;font-size:0.85rem;outline:none;cursor:pointer;min-width:155px;}
main{max-width:1300px;margin:0 auto;padding:1.5rem 1.2rem 9rem;}
.label{font-size:0.72rem;color:var(--gold);letter-spacing:0.12em;margin-bottom:1rem;padding-right:0.8rem;border-right:3px solid var(--gold);}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:0.85rem;}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:1rem 1.1rem;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;gap:0.8rem;}
.card:hover{border-color:rgba(201,168,76,0.5);transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,0.4);}
.card.active{border-color:var(--gold);background:var(--card2);}
.num{width:40px;height:40px;border-radius:50%;background:#0d1520;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:0.76rem;color:var(--gold);font-weight:700;flex-shrink:0;}
.info{flex:1;min-width:0;}
.name{font-family:'Scheherazade New',serif;font-size:1.08rem;color:var(--text);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ayat{font-size:0.7rem;color:var(--muted);margin-top:1px;}
.tag{font-size:0.62rem;padding:2px 7px;border-radius:20px;flex-shrink:0;}
.makki{background:rgba(201,168,76,0.1);color:var(--gold);border:1px solid rgba(201,168,76,0.2);}
.madani{background:rgba(26,58,42,0.5);color:#6db890;border:1px solid rgba(109,184,144,0.2);}
.player{position:fixed;bottom:0;left:0;right:0;z-index:100;background:rgba(10,12,15,0.98);backdrop-filter:blur(20px);border-top:1px solid var(--border);padding:0.75rem 1.2rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap;transition:transform 0.3s;}
.player.hidden{transform:translateY(100%);}
.pinfo{flex:1;min-width:140px;}
.ptitle{font-family:'Scheherazade New',serif;font-size:1.1rem;color:var(--gold);}
.preader{font-size:0.75rem;color:var(--muted);margin-top:1px;}
.ctrls{display:flex;align-items:center;gap:0.5rem;}
.btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--border);background:var(--card2);color:var(--text);font-size:0.95rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.18s;}
.btn:hover{border-color:var(--gold);color:var(--gold);}
.playbtn{width:46px;height:46px;background:var(--gold);border-color:var(--gold);color:#0a0c0f;font-size:1.05rem;}
.playbtn:hover{background:var(--gold-light);}
.prog{flex:2;min-width:160px;display:flex;align-items:center;gap:0.6rem;}
.prog input[type=range]{flex:1;height:4px;-webkit-appearance:none;background:var(--card2);border-radius:2px;outline:none;cursor:pointer;}
.prog input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--gold);cursor:pointer;}
.t{font-size:0.7rem;color:var(--muted);min-width:32px;}
.dlbtn{padding:0.4rem 0.9rem;border-radius:50px;border:1px solid var(--gold);background:transparent;color:var(--gold);font-family:'Cairo',sans-serif;font-size:0.78rem;cursor:pointer;text-decoration:none;transition:all 0.18s;white-space:nowrap;}
.dlbtn:hover{background:var(--gold);color:#0a0c0f;}
.vol{display:flex;align-items:center;gap:0.4rem;}
.vol input[type=range]{width:75px;height:4px;-webkit-appearance:none;background:var(--card2);border-radius:2px;outline:none;cursor:pointer;}
.vol input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;border-radius:50%;background:var(--muted);cursor:pointer;}
.empty{text-align:center;color:var(--muted);padding:3rem;font-size:1rem;}
audio{display:none;}
@media(max-width:580px){.grid{grid-template-columns:1fr 1fr;gap:0.55rem;}.player{gap:0.6rem;padding:0.65rem 0.8rem;}}
</style>
</head>
<body>
<header>
  <div class="bismillah">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>
  <h1>القرآن الكريم — استمع إلى كلام الله</h1>
  <span class="line"></span>
</header>
<div class="bar">
  <input type="text" id="search" placeholder="ابحث عن سورة..." oninput="filter()">
  <select id="reader" onchange="changeReader()">
    <option value="ar.alafasy">مشاري العفاسي</option>
    <option value="ar.abdurrahmaansudais">عبد الرحمن السديس</option>
    <option value="ar.husary">محمود خليل الحصري</option>
    <option value="ar.minshawi">محمد صديق المنشاوي</option>
    <option value="ar.muhammadayyoub">محمد أيوب</option>
    <option value="ar.shaatree">أبو بكر الشاطري</option>
    <option value="ar.saoodshuraym">سعود الشريم</option>
  </select>
</div>
<main>
  <p class="label">السور الكريمة — ١١٤ سورة</p>
  <div class="grid" id="grid"></div>
</main>
<div class="player hidden" id="player">
  <div class="pinfo">
    <div class="ptitle" id="ptitle">—</div>
    <div class="preader" id="preader">—</div>
  </div>
  <div class="ctrls">
    <button class="btn" onclick="prev()">⏮</button>
    <button class="btn playbtn" id="playbtn" onclick="togglePlay()">▶</button>
    <button class="btn" onclick="next()">⏭</button>
  </div>
  <div class="prog">
    <span class="t" id="ct">0:00</span>
    <input type="range" id="pb" min="0" max="100" value="0" oninput="seek(this.value)">
    <span class="t" id="dt">0:00</span>
  </div>
  <div class="vol">🔊<input type="range" id="vol" min="0" max="1" step="0.05" value="1" oninput="setVol(this.value)"></div>
  <a class="dlbtn" id="dl" href="#" download>⬇ تحميل</a>
</div>
<audio id="audio"></audio>
<script>
const S=[
  ["الفاتحة",7,"مكية"],["البقرة",286,"مدنية"],["آل عمران",200,"مدنية"],
  ["النساء",176,"مدنية"],["المائدة",120,"مدنية"],["الأنعام",165,"مكية"],
  ["الأعراف",206,"مكية"],["الأنفال",75,"مدنية"],["التوبة",129,"مدنية"],
  ["يونس",109,"مكية"],["هود",123,"مكية"],["يوسف",111,"مكية"],
  ["الرعد",43,"مدنية"],["إبراهيم",52,"مكية"],["الحجر",99,"مكية"],
  ["النحل",128,"مكية"],["الإسراء",111,"مكية"],["الكهف",110,"مكية"],
  ["مريم",98,"مكية"],["طه",135,"مكية"],["الأنبياء",112,"مكية"],
  ["الحج",78,"مدنية"],["المؤمنون",118,"مكية"],["النور",64,"مدنية"],
  ["الفرقان",77,"مكية"],["الشعراء",227,"مكية"],["النمل",93,"مكية"],
  ["القصص",88,"مكية"],["العنكبوت",69,"مكية"],["الروم",60,"مكية"],
  ["لقمان",34,"مكية"],["السجدة",30,"مكية"],["الأحزاب",73,"مدنية"],
  ["سبأ",54,"مكية"],["فاطر",45,"مكية"],["يس",83,"مكية"],
  ["الصافات",182,"مكية"],["ص",88,"مكية"],["الزمر",75,"مكية"],
  ["غافر",85,"مكية"],["فصلت",54,"مكية"],["الشورى",53,"مكية"],
  ["الزخرف",89,"مكية"],["الدخان",59,"مكية"],["الجاثية",37,"مكية"],
  ["الأحقاف",35,"مكية"],["محمد",38,"مدنية"],["الفتح",29,"مدنية"],
  ["الحجرات",18,"مدنية"],["ق",45,"مكية"],["الذاريات",60,"مكية"],
  ["الطور",49,"مكية"],["النجم",62,"مكية"],["القمر",55,"مكية"],
  ["الرحمن",78,"مدنية"],["الواقعة",96,"مكية"],["الحديد",29,"مدنية"],
  ["المجادلة",22,"مدنية"],["الحشر",24,"مدنية"],["الممتحنة",13,"مدنية"],
  ["الصف",14,"مدنية"],["الجمعة",11,"مدنية"],["المنافقون",11,"مدنية"],
  ["التغابن",18,"مدنية"],["الطلاق",12,"مدنية"],["التحريم",12,"مدنية"],
  ["الملك",30,"مكية"],["القلم",52,"مكية"],["الحاقة",52,"مكية"],
  ["المعارج",44,"مكية"],["نوح",28,"مكية"],["الجن",28,"مكية"],
  ["المزمل",20,"مكية"],["المدثر",56,"مكية"],["القيامة",40,"مكية"],
  ["الإنسان",31,"مدنية"],["المرسلات",50,"مكية"],["النبأ",40,"مكية"],
  ["النازعات",46,"مكية"],["عبس",42,"مكية"],["التكوير",29,"مكية"],
  ["الانفطار",19,"مكية"],["المطففين",36,"مكية"],["الانشقاق",25,"مكية"],
  ["البروج",22,"مكية"],["الطارق",17,"مكية"],["الأعلى",19,"مكية"],
  ["الغاشية",26,"مكية"],["الفجر",30,"مكية"],["البلد",20,"مكية"],
  ["الشمس",15,"مكية"],["الليل",21,"مكية"],["الضحى",11,"مكية"],
  ["الشرح",8,"مكية"],["التين",8,"مكية"],["العلق",19,"مكية"],
  ["القدر",5,"مكية"],["البينة",8,"مدنية"],["الزلزلة",8,"مدنية"],
  ["العاديات",11,"مكية"],["القارعة",11,"مكية"],["التكاثر",8,"مكية"],
  ["العصر",3,"مكية"],["الهمزة",9,"مكية"],["الفيل",5,"مكية"],
  ["قريش",4,"مكية"],["الماعون",7,"مكية"],["الكوثر",3,"مكية"],
  ["الكافرون",6,"مكية"],["النصر",3,"مدنية"],["المسد",5,"مكية"],
  ["الإخلاص",4,"مكية"],["الفلق",5,"مكية"],["الناس",6,"مكية"]
];
const R={
  "ar.alafasy":{name:"مشاري العفاسي"},
  "ar.abdurrahmaansudais":{name:"عبد الرحمن السديس"},
  "ar.husary":{name:"محمود خليل الحصري"},
  "ar.minshawi":{name:"محمد صديق المنشاوي"},
  "ar.muhammadayyoub":{name:"محمد أيوب"},
  "ar.shaatree":{name:"أبو بكر الشاطري"},
  "ar.saoodshuraym":{name:"سعود الشريم"}
};
let cur=-1,playing=false;
const audio=document.getElementById('audio');
const playbtn=document.getElementById('playbtn');
const pb=document.getElementById('pb');

function url(i,rk){
  return `https://cdn.islamic.network/quran/audio-surah/128/${rk}/${i+1}.mp3`;
}
function render(f=''){
  const g=document.getElementById('grid');
  g.innerHTML='';
  let n=0;
  S.forEach((s,i)=>{
    if(f&&!s[0].includes(f)&&!String(i+1).includes(f))return;
    n++;
    const d=document.createElement('div');
    d.className='card'+(i===cur?' active':'');
    d.id='c'+i;
    d.onclick=()=>play(i);
    d.innerHTML=`<div class="num">${i+1}</div><div class="info"><span class="name">${s[0]}</span><div class="ayat">${s[1]} آية</div></div><span class="tag ${s[2]==='مكية'?'makki':'madani'}">${s[2]}</span>`;
    g.appendChild(d);
  });
  if(!n)g.innerHTML='<p class="empty">لا توجد نتائج</p>';
}
function play(i){
  cur=i;
  const rk=document.getElementById('reader').value;
  const u=url(i,rk);
  audio.src=u;
  audio.load();
  audio.play().then(()=>{playing=true;playbtn.textContent='⏸';}).catch(()=>{});
  document.getElementById('ptitle').textContent='سورة '+S[i][0];
  document.getElementById('preader').textContent=R[rk].name;
  document.getElementById('dl').href=u;
  document.getElementById('dl').download=S[i][0]+'.mp3';
  document.getElementById('player').classList.remove('hidden');
  document.querySelectorAll('.card').forEach(c=>c.classList.remove('active'));
  const card=document.getElementById('c'+i);
  if(card){card.classList.add('active');card.scrollIntoView({behavior:'smooth',block:'nearest'});}
}
function togglePlay(){
  if(playing){audio.pause();playing=false;playbtn.textContent='▶';}
  else{audio.play();playing=true;playbtn.textContent='⏸';}
}
function next(){if(cur<S.length-1)play(cur+1);}
function prev(){if(cur>0)play(cur-1);}
function seek(v){if(audio.duration)audio.currentTime=(v/100)*audio.duration;}
function setVol(v){audio.volume=v;}
function filter(){render(document.getElementById('search').value.trim());}
function changeReader(){if(cur>=0)play(cur);}
function fmt(s){if(isNaN(s))return'0:00';const m=Math.floor(s/60),sc=Math.floor(s%60);return m+':'+(sc<10?'0':'')+sc;}
audio.addEventListener('timeupdate',()=>{
  if(audio.duration){
    pb.value=(audio.currentTime/audio.duration)*s100;
    document.getElementById('ct').textContent=fmt(audio.currentTime);
    document.getElementById('dt').textContent=fmt(audio.duration);
  }
});
audio.addEventListener('ended',next);
render();
</script>
</body>
</html>
EOF
